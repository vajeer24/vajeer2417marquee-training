<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">      
    <title>Document</title>
     <head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <style>
            .container{
                display: grid;
                 grid-template-columns:  200px 200px 200px 200px 200px 200px 200px 200px 200px 200px 200px 200px 200px 2z00px;
                grid-template-rows: 150px 150px 150px 150px 150px 150px 150px 150px 150px 150px;
                gap:5px;
                background-color:white;
             grid-column: 100%;
}

.item{
    background-color: black;
    border:2px solid white;
}
.item1{
    grid-column:1/3;
    grid-row:1;
    display:flex;
    place-items:center;
     align-content:center;
    justify-content:center;
    }
.circle{
    background-color:white;
    height:70px;
    width:70px;
    border-radius:50%;
    display:flex;
    position:relative;
    align-content:center;
    justify-content:center;
}
.item2{
    grid-column:1/3;
    grid-row:2/10;
}
.item3{
    grid-column:3/15;
    grid-row:1;
    display:flex;
    align-items:center;
    gap:30px;
}
.menu{
   color:white;
    font-size:30px;
    margin-left:30px;
}
.live{
     color:white;
    font-size:30px;
    display:flex;
    align-items:center;
    gap:10px;
    margin-left:40px;
}
.doc{
    color:white;
    font-size:30px;
    display:flex;
    align-items:center;
    gap:10px;
    margin-left:30px; 
}
.right-icons{
    color:white;
    margin-left:auto;
    align-items:center;
    display:flex;
    gap:50px;
    font-size:40px;

}
.icon-badge{
    position:relative;
}

.badge{
    position:absolute;
    top:-8px;
    right:-10px;

    width:16px;
    height:16px;

    border-radius:50%;
    font-size:10px;

    display:flex;
    justify-content:center;
    align-items:center;
}

.red{
    background:red;
}

.yellow{
    background:gold;
    color:black;
}

.profile{
    width:50px;
    height:50px;
    border-radius:50%;
    background-color: white;
    border:2px solid red;
    object-fit:cover;
      display:flex;
    justify-content:center;
    align-items:center;

    font-weight:bold;
}

.username{
    font-size:20px;
}

.item4{
    grid-column:3/15;
    grid-row:2;
    background-color:white;
    border:2px solid black;
    font-size:30px;
    margin-left: 10px;
}
.item5{
    grid-column:3/6;
    grid-row:3/5;
    background-color:blue;
}
.item6{
    grid-column:6/9;
    grid-row:3/5;
    background-color:rgb(9, 247, 60);
}
.item7{
    grid-column:9/12;
    grid-row:3/5;
    background-color:rgb(252, 252, 3);
}
.item8{
    grid-column:12/15;
    grid-row:3/5;
    background-color:rgb(245, 28, 28);
}
.item9{
    background-color: rgb(189, 38, 38);
    grid-column:3/9;
    grid-row: 5/10;
    border: 2px solid black;
     background-repeat: no-repeat;
    background-image: url("Screenshot\ 2026-06-05\ 174312.png");
    background-size: cover;
    background-size: 100% 100%;
}


.item10{
    background-color: rgb(189, 38, 38);
    grid-column:9/15;
    grid-row: 5/10;
    gap: 10px;
   background-repeat: no-repeat;
    background-image: url("Screenshot\ 2026-06-05\ 174826.png");
    background-size: 100% 100%;
}


            

        </style>
</head>
<body>
    <div class="container">
    <div class="item item1">
        <div class="circle"><h1>A</h1></div>
        <h1 style="color: white;">AdminLTE</h1>
    </div>
      <div class="item item2"></div> 
      <div class="item item3">
        <div class="menu">&#9776</div>
        <div class="live">
        <i class="fa-solid fa-table-columns"></i>
        Live preview </div>
        <div class="doc">
            <i class="fa-solid fa-book-open"></i>
            Documentation
        </div>
        <div class="right-icons">
            <i class="fa-solid fa-magnifying-glass"></i>
             <div class="icon-badge">
            <i class="fa-regular fa-comments"></i>
            <span class="badge red">3</span>
        </div>

        <div class="icon-badge">
            <i class="fa-regular fa-bell"></i>
            <span class="badge yellow">15</span>
        </div>

        <i class="fa-solid fa-expand"></i>
        <i class="fa-solid fa-moon"></i>
 <div class="profile">V</div>
    <div class="username"><h2>Vaishnavi</h2></div>
        

        
    
        </div>
    

      </div>
      <div class="item item4">
        <h2>Dashboard</h2>
      </div>
      <div class="item item5"></div>
      <div class="item item6"></div>
      <div class="item item7"></div>
      <div class="item item8"></div>
      <div class="item9"></div>
      <div class="item10"></div>
    </div>

</body>
</html>
