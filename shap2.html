<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    :root{
        --mainColor:green;
        --defaultBorder:2px solid yellow;
    

    }
    

.container{
    width:1000px;
    height:600px;
    border: var(--defaultBorder);
    background-color:var(--mainColor);

}
.rectanle {
    width:400px;
    height:100px;
    border:var(--defaultBorder);
    display: inline-block;
    margin-top: 10px;
    margin-left:40px;
    display: inline-block;
    border-radius: 20px;
    background-color:Red;
    

}
.rectanle2 {
    width:400px;
    height:100px;
    display: inline-block;
    border-radius:20px;
    background-color:pink;
    border: var(--defaultBorder);
    
    
}
.rectanle3 {
    width:600px;
    height:250px;
    border:2px solid black;
    display: inline-block;
    margin-top:20px;
    border-radius: 20px;
    margin-left:150px;
    border:var(--defaultBorder);
    background-color:blue;
}
.circle{
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border:2px solid black;
    margin-left: 400px;
    background-color: blueviolet;
    
}
</style>



<body>
    <div class="container">
    <div class="rectanle"></div>
    <div class="rectanle2"></div>
    <div class="rectanle3"></div>
    <div class="circle"></div>

    


    </div>
</body>
</html>
