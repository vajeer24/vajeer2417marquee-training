<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 100px 100px 100px 100px 100px 100px 100px 100px 100px 100px 100px 100px;
            grid-template-rows: 100px 100px 100px 100px 100px 100px 100px 100px 100px 100px 100px 100px ;
            border: 2px solid black;
            gap:5px;
                }
                .item{
                    background-color: rgb(166, 0, 255);

                }
                .item1{
                    background-color: rgb(166, 0, 255);
                    grid-row: 2/3;
                    grid-column: 2/3;

                }
                .item2{
                    background-color: rgb(166, 0, 255);
                    grid-row: 3/3;
                    grid-column: 3/4;
    }
                .item3{
                    background-color: rgb(166, 0, 255);
                    grid-row: 4/4;
                    grid-column:4/5;
    }
    .item4{
                    background-color: rgb(166, 0, 255);
                    grid-row: 5/5;
                    grid-column:5/6;
    }
    .item5{
                    background-color: rgb(166, 0, 255);
                    grid-row: 6/6;
                    grid-column:6/7;
    }
    .item6{
                    background-color: rgb(166, 0, 255);
                    grid-row: 5/5;
                    grid-column:7/8;
    }
    .item7{
                    background-color: rgb(166, 0, 255);
                    grid-row: 4/5;
                    grid-column:8/9;
    }
    .item8{
                    background-color: rgb(166, 0, 255);
                    grid-row: 3/3;
                    grid-column:9/10
    }
    .item8{
                    background-color: rgb(166, 0, 255);
                    grid-row:2/3;
                    grid-column:10/11
    }
    .item9{
                    background-color: rgb(166, 0, 255);
                    grid-row:3/3;
                    grid-column:9/10
    }
    .item10{
                    background-color: rgb(166, 0, 255);
                    grid-row:1/2;
                    grid-column:11/12;
    }
    </style>
    
</head>
<body>
    <div class="container">
        <div class="item"></div>
        <div class="item1"></div>
        <div class="item2"></div>
        <div class="item3"></div>
        <div class="item4"></div>
        <div class="item5"></div>
        <div class="item6"></div>
        <div class="item7"></div>
        <div class="item8"></div>
        <div class="item9"></div>
        <div class="item10"></div>
    </div>
    
</body>
</html>
