<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container {
            width: 40%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3,1fr);
            gap: 10px;
            padding: 10px;
        }
        .grid-item-1 {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            padding: 20px;
            text-align: center;
            grid-column: 1 / 3; 
            grid-row: 1/3;
        }
        .grid-item-2 {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            padding: 20px;
            text-align: center;
            

        }
        .grid-item-3 {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            padding: 20px;
            text-align: center;
            
        }
        .grid-item-4 {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            padding: 20px;
            text-align: center;
            
        }
        .grid-item-5 {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            padding: 20px;
            text-align: center;
        }
        .grid-item-6 {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            padding: 20px;
            text-align: center;
            
            grid-column: 1/5;
        }
    </style>
</head>

<body>
    
</body>
<div class="grid-container">
    <div class="grid-item-1">1</div>
    <div class="grid-item-2">2</div>
    <div class="grid-item-3">3</div>  
    <div class="grid-item-4">4</div>
    <div class="grid-item-5">5</div>
    <div class="grid-item-6">6</div>   
</div>
</html>
